[project]
name = "poc-local-claims-agent"
version = "0.11.0"
description = "PoC 11 integrated - Conversation Memory + Customer REST/MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "pydantic-ai-slim[openai]",
    "httpx",
    "pypdf",
    "pillow",
    "pytesseract",
    "pypdfium2",
    "qdrant-client",
    "email-validator",
    "mcp>=2,<3",
    "a2a-sdk[fastapi]==1.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["."]
